<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="ad.size" content="width=728,height=90" />
    <title>EcoBrew — Coffee that gives back</title>

    <script>
      let clickTag = "";
      let FALLBACK_URL = "https://www.linkedin.com/in/tamas-fehertoi-97b304293"; // <-- replace with your own link
    </script>

    <style>
      :root {
        --bg-deep: #142a1d;
        --bg-mid: #1e3b27;
        --gold: #d9a94e;
        --cream: #f4efe3;
        --mute: #9fb3a2;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 728px;
        height: 90px;
        overflow: hidden;
        background: var(--bg-deep);
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          Segoe UI,
          sans-serif;
      }

      #banner {
        position: relative;
        width: 728px;
        height: 90px;
        cursor: pointer;
        background: linear-gradient(
          100deg,
          var(--bg-deep) 0%,
          var(--bg-mid) 100%
        );
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 18px;
      }

      #cup {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        opacity: 0;
        transform: translateY(6px);
      }
      #cup path {
        fill: none;
        stroke: var(--gold);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #steam path {
        stroke: var(--mute);
      }

      #copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        overflow: hidden;
      }
      #headline {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 22px;
        color: var(--cream);
        margin: 0;
        opacity: 0;
        transform: translateY(10px);
        white-space: nowrap;
      }
      #headline span {
        color: var(--gold);
      }
      #subline {
        font-size: 12px;
        color: var(--mute);
        margin: 0;
        opacity: 0;
        white-space: nowrap;
      }

      #cta {
        margin-left: auto;
        flex: 0 0 auto;
        background: var(--gold);
        color: var(--bg-deep);
        font-weight: 600;
        font-size: 14px;
        padding: 10px 20px;
        border-radius: 99px;
        opacity: 0;
        transform: scale(0.85);
        white-space: nowrap;
      }

      #line {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: var(--mute);
        opacity: 0.25;
      }
    </style>
  </head>
  <body>
    <div id="banner">
      <svg id="cup" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <path id="cup-body" d="M9 18 H31 V30 A11 11 0 0 1 9 30 Z" />
        <path id="cup-handle" d="M31 21 H35 A5 5 0 0 1 35 31 H31" />
        <g id="steam">
          <path d="M15 14 C15 10 19 10 19 6" />
          <path d="M23 14 C23 10 27 10 27 6" />
        </g>
      </svg>

      <div id="copy">
        <p id="headline">Coffee that gives <span>back.</span></p>
        <p id="subline">Carbon-neutral beans, delivered monthly.</p>
      </div>

      <div id="cta">Subscribe</div>
      <div id="line"></div>
    </div>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      (function () {
        document
          .getElementById("banner")
          .addEventListener("click", function () {
            window.open(window.clickTag || FALLBACK_URL, "_blank");
          });

        function prepDraw(id) {
          let el = document.getElementById(id);
          let len = el.getTotalLength();
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
        }
        ["cup-body", "cup-handle"].forEach(prepDraw);
        document.querySelectorAll("#steam path").forEach(function (p) {
          let len = p.getTotalLength();
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
        });

        let tl = gsap.timeline({ repeat: 2, repeatDelay: 1.2 });

        tl.to("#cup", { opacity: 1, y: 0, duration: 0.4, ease: "power1.out" })
          .to(
            ["#cup-body", "#cup-handle"],
            { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" },
            "<",
          )
          .to(
            "#steam path",
            {
              strokeDashoffset: 0,
              duration: 0.6,
              stagger: 0.15,
              ease: "power1.inOut",
            },
            "-=0.15",
          )
          .to(
            "#headline",
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            0.35,
          )
          .to(
            "#subline",
            { opacity: 1, duration: 0.4, ease: "power1.out" },
            0.6,
          )
          .to(
            "#cta",
            { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" },
            0.75,
          )
          .to(
            "#cta",
            {
              scale: 1.04,
              duration: 0.3,
              ease: "sine.inOut",
              yoyo: true,
              repeat: 1,
            },
            "+=0.4",
          )
          .to(
            ["#cup", "#headline", "#subline", "#cta"],
            { opacity: 0, duration: 0.35, ease: "power1.in" },
            "+=1.1",
          )
          .set("#cup", { y: 6 })
          .set("#headline", { y: 10 })
          .set("#cta", { scale: 0.85 })
          .set(["#cup-body", "#cup-handle"], {
            strokeDashoffset: function () {
              return this.target.getTotalLength();
            },
          })
          .set("#steam path", {
            strokeDashoffset: function () {
              return this.target.getTotalLength();
            },
          });
      })();
    </script>
  </body>
</html>
