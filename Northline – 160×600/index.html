<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="ad.size" content="width=160,height=600" />
    <title>Northline — Gear built for further</title>

    <script>
      let clickTag = "";
      let FALLBACK_URL = "https://www.linkedin.com/in/tamas-fehertoi-97b304293"; // <-- replace with your own link
    </script>

    <style>
      :root {
        --bg-deep: #10151c;
        --bg-mid: #1a222d;
        --rust: #c1613b;
        --ice: #7fa8b8;
        --text: #edeff2;
        --mute: #7c8794;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 160px;
        height: 600px;
        overflow: hidden;
        background: var(--bg-deep);
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          Segoe UI,
          sans-serif;
      }

      #banner {
        position: relative;
        width: 160px;
        height: 600px;
        cursor: pointer;
        background: linear-gradient(
          180deg,
          var(--bg-mid) 0%,
          var(--bg-deep) 70%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 22px 16px;
      }

      #logo {
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0;
      }
      #logo svg {
        width: 18px;
        height: 18px;
      }
      #logo path {
        fill: none;
        stroke: var(--ice);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #logo span {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--text);
      }

      #peaks {
        width: 128px;
        height: 110px;
        margin: 26px 0 18px;
        opacity: 0;
      }
      #peaks path {
        fill: none;
        stroke: var(--ice);
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #headline {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 30px;
        line-height: 1.05;
        letter-spacing: 0.01em;
        color: var(--text);
        text-align: center;
        text-transform: uppercase;
        margin: 0 0 10px;
        opacity: 0;
        transform: translateY(12px);
      }
      #headline em {
        font-style: normal;
        color: var(--rust);
      }

      #subline {
        font-size: 12px;
        line-height: 1.5;
        color: var(--mute);
        text-align: center;
        max-width: 120px;
        margin: 0;
        opacity: 0;
      }

      #cta {
        margin-top: auto;
        background: var(--rust);
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        padding: 11px 22px;
        border-radius: 99px;
        opacity: 0;
        transform: scale(0.85);
      }
    </style>
  </head>
  <body>
    <div id="banner">
      <div id="logo">
        <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 14 L7 5 L10 10 L12 7 L16 14 Z" />
        </svg>
        <span>NORTHLINE</span>
      </div>

      <svg id="peaks" viewBox="0 0 128 110" xmlns="http://www.w3.org/2000/svg">
        <path id="peak-1" d="M2 100 L34 30 L56 66 L74 20 L98 66 L126 42" />
        <path id="peak-2" d="M2 108 L28 60 L50 88 L70 50 L92 88 L126 66" />
      </svg>

      <h1 id="headline">Gear built<br />for <em>further.</em></h1>
      <p id="subline">
        Trail-tested equipment for wherever you're headed next.
      </p>

      <div id="cta">Shop now</div>
    </div>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      (function () {
        document
          .getElementById("banner")
          .addEventListener("click", function () {
            window.open(window.clickTag || FALLBACK_URL, "_blank");
          });

        ["peak-1", "peak-2"].forEach(function (id) {
          let el = document.getElementById(id);
          let len = el.getTotalLength();
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
        });

        let tl = gsap.timeline({ repeat: 2, repeatDelay: 1.3 });

        tl.to("#logo", { opacity: 1, duration: 0.4, ease: "power1.out" })
          .to("#peaks", { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.25)
          .to(
            ["#peak-1", "#peak-2"],
            {
              strokeDashoffset: 0,
              duration: 0.9,
              stagger: 0.15,
              ease: "power2.inOut",
            },
            0.3,
          )
          .to(
            "#headline",
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            0.9,
          )
          .to(
            "#subline",
            { opacity: 1, duration: 0.4, ease: "power1.out" },
            1.15,
          )
          .to(
            "#cta",
            { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" },
            1.35,
          )
          .to(
            "#cta",
            {
              scale: 1.05,
              duration: 0.3,
              ease: "sine.inOut",
              yoyo: true,
              repeat: 1,
            },
            "+=0.4",
          )
          .to(
            ["#logo", "#peaks", "#headline", "#subline", "#cta"],
            { opacity: 0, duration: 0.35, ease: "power1.in" },
            "+=1.1",
          )
          .set("#headline", { y: 12 })
          .set("#cta", { scale: 0.85 })
          .set(["#peak-1", "#peak-2"], {
            strokeDashoffset: function () {
              return this.target.getTotalLength();
            },
          });
      })();
    </script>
  </body>
</html>
