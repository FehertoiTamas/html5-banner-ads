<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="ad.size" content="width=320,height=50" />
    <title>Fintra — Save smarter</title>

    <script>
      let clickTag = "";
      let FALLBACK_URL = "https://www.linkedin.com/in/tamas-fehertoi-97b304293"; // <-- replace with your own link
    </script>

    <style>
      :root {
        --bg-deep: #1b1730;
        --bg-mid: #251f42;
        --mint: #6ee7b7;
        --text: #f3f1fa;
        --mute: #b4adc9;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 320px;
        height: 50px;
        overflow: hidden;
        background: var(--bg-deep);
      }
      body {
        font-family:
          "Manrope",
          -apple-system,
          Segoe UI,
          sans-serif;
      }

      #banner {
        position: relative;
        width: 320px;
        height: 50px;
        cursor: pointer;
        background: linear-gradient(
          95deg,
          var(--bg-deep) 0%,
          var(--bg-mid) 100%
        );
        display: flex;
        align-items: center;
        padding: 0 10px;
        gap: 8px;
      }

      #logo {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        opacity: 0;
        transform: scale(0.7);
      }
      #logo path {
        fill: none;
        stroke: var(--mint);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        line-height: 1.15;
        overflow: hidden;
      }
      #headline {
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        margin: 0;
        opacity: 0;
        white-space: nowrap;
      }
      #counter-row {
        font-size: 10px;
        color: var(--mute);
        margin: 0;
        opacity: 0;
        white-space: nowrap;
      }
      #counter {
        color: var(--mint);
        font-weight: 700;
      }

      #cta {
        margin-left: auto;
        flex: 0 0 auto;
        background: var(--mint);
        color: var(--bg-deep);
        font-weight: 700;
        font-size: 11px;
        padding: 6px 12px;
        border-radius: 99px;
        opacity: 0;
        transform: scale(0.85);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="banner">
      <svg id="logo" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 16 L8 10 L12 13 L19 5" />
        <path d="M14 5 H19 V10" />
      </svg>

      <div id="copy">
        <p id="headline">Save smarter with Fintra</p>
        <p id="counter-row">This month: <span id="counter">$0</span> saved</p>
      </div>

      <div id="cta">Get app</div>
    </div>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      (function () {
        document
          .getElementById("banner")
          .addEventListener("click", function () {
            window.open(window.clickTag || FALLBACK_URL, "_blank");
          });

        let counterEl = document.getElementById("counter");
        let counterObj = { val: 0 };

        let tl = gsap.timeline({ repeat: 2, repeatDelay: 1.0 });

        tl.to("#logo", {
          opacity: 1,
          scale: 1,
          duration: 0.35,
          ease: "back.out(2.5)",
        })
          .to(
            "#headline",
            { opacity: 1, duration: 0.35, ease: "power1.out" },
            0.2,
          )
          .to(
            "#counter-row",
            { opacity: 1, duration: 0.3, ease: "power1.out" },
            0.4,
          )
          .to(
            counterObj,
            {
              val: 1240,
              duration: 0.9,
              ease: "power1.out",
              onUpdate: function () {
                counterEl.textContent =
                  "$" + Math.round(counterObj.val).toLocaleString("en-US");
              },
            },
            0.5,
          )
          .to(
            "#cta",
            { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" },
            1.0,
          )
          .to(
            "#cta",
            {
              scale: 1.06,
              duration: 0.25,
              ease: "sine.inOut",
              yoyo: true,
              repeat: 1,
            },
            "+=0.3",
          )
          .to(
            ["#logo", "#headline", "#counter-row", "#cta"],
            { opacity: 0, duration: 0.3, ease: "power1.in" },
            "+=1.0",
          )
          .set("#logo", { scale: 0.7 })
          .set("#cta", { scale: 0.85 })
          .set(counterObj, { val: 0 })
          .set(counterEl, { textContent: "$0" });
      })();
    </script>
  </body>
</html>
